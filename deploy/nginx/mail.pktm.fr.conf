server {
    listen 80;
    server_name mail.pktm.fr;
    return 301 https://mail.pktm.fr$request_uri;
}
server {
    listen 443 ssl;
    server_name mail.pktm.fr;
    ssl_certificate /etc/letsencrypt/live/mail.pktm.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.pktm.fr/privkey.pem;
    client_max_body_size 50m;
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name mail.pktm.fr;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
    }
}
